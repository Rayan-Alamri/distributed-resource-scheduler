services:
  master:
    build: .
    command: master
    environment:
      MASTER_PORT: "9090"
      DEMO_TASKS: "0"
    ports:
      - "9090:9090"
    volumes:
      - ./videos:/videos
      - ./logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scheduler-net

  worker_rpi3:
    build: .
    command: worker master 9090
    depends_on:
      - master
    environment:
      VIDEO_DIR: "/videos"
    volumes:
      - ./videos:/videos
      - ./logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scheduler-net
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  worker_rpi4:
    build: .
    command: worker master 9090
    depends_on:
      - master
    environment:
      VIDEO_DIR: "/videos"
    volumes:
      - ./videos:/videos
      - ./logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scheduler-net
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  worker_rpi5:
    build: .
    command: worker master 9090
    depends_on:
      - master
    environment:
      VIDEO_DIR: "/videos"
    volumes:
      - ./videos:/videos
      - ./logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scheduler-net
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '2.0'
          memory: 1G

  submit:
    build: .
    entrypoint: submit
    depends_on:
      - master
    volumes:
      - ./videos:/videos
    networks:
      - scheduler-net
    environment:
      SUBMIT_HOST:     "master"
      SUBMIT_PORT:     "9090"
      SUBMIT_COUNT:    "1"
      SUBMIT_CMD:      "1"
      SUBMIT_ARG:      "5000000"
      SUBMIT_START_ID: "100"
    profiles:
      - tools

networks:
  scheduler-net:
    driver: bridge
